[project]
name = "recette-frigo"
version = "0.1.0"
description = "Flow LLMOps qui invente une recette selon le frigo, les appareils et le temps disponibles."
requires-python = ">=3.11,<3.13"
dependencies = [
    "chainlit>=2.12,<3",
    "google-cloud-aiplatform>=1.165,<2",
    "google-genai>=1.0,<2",
    "kfp>=2.18,<3",
    "langfuse>=3.15,<4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "src/shared"]
testpaths = ["tests"]

[tool.uv]
package = false
